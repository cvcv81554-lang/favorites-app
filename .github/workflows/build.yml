name: Build
# يبني APK (أندرويد/Android TV) و IPA غير موقَّع (آيفون) وينشرهما في Release ثابت الاسم «latest».
# روابط التحميل المباشرة الثابتة:
#   https://github.com/<OWNER>/<REPO>/releases/download/latest/Favorites.apk
#   https://github.com/<OWNER>/<REPO>/releases/download/latest/Favorites.ipa
on:
  push:
    branches: [main, bg-beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_NAME: 1.0.${{ github.run_number }}
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version code (minutes since epoch, same formula as the local build)
        run: echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: node scripts/patch-android.mjs
      - run: npx cap sync android
      - name: Gradle assembleRelease (unsigned)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Sign with the fixed keystore (zipalign + apksigner)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Secrets KEYSTORE_B64 / KEYSTORE_PASS are missing. Run scripts/publish.ps1 (it sets them)."; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore" node scripts/sign-apk.mjs
          rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: dist/Favorites.apk, if-no-files-found: error }

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Version code (minutes since epoch, same formula as the local build)
        run: echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap add ios
      - run: node scripts/patch-ios.mjs
      - run: npx cap sync ios
      - name: xcodebuild (no code signing)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$VERSION_CODE" build | tail -n 40
      - name: Package Payload/App.app as .ipa
        run: |
          mkdir -p Payload dist
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry dist/Favorites.ipa Payload
          ls -la dist
      - uses: actions/upload-artifact@v4
        with: { name: ipa, path: dist/Favorites.ipa, if-no-files-found: error }

  release:
    needs: [android, ios]
    if: ${{ !cancelled() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish to the fixed "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          NOTES="Build $VERSION_NAME · commit ${GITHUB_SHA::7} · APK: ${{ needs.android.result }} · IPA: ${{ needs.ios.result }}"
          if [ "$GITHUB_REF_NAME" = "bg-beta" ]; then
            # نسخة تجريبية منفصلة: لا تمس «latest»
            gh release view beta >/dev/null 2>&1 || gh release create beta --target "$GITHUB_SHA" --title "Favorites beta" --notes "$NOTES" --prerelease
            gh release upload beta dist/* --clobber
            gh release edit beta --title "Favorites beta $VERSION_NAME (تحديث في الخلفية — تجريبي)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          else
            gh release view latest >/dev/null 2>&1 || gh release create latest --target "$GITHUB_SHA" --title "Favorites" --notes "$NOTES"
            gh release upload latest dist/* --clobber
            gh release edit latest --title "Favorites $VERSION_NAME" --notes "$NOTES" --latest
          fi
